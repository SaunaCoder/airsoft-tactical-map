# Single public entry point: HTTPS termination, then /api + /socket.io -> server, everything else -> web.
# Same origin for all of it, so the apps need no CORS config.

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;

    # Self-signed locally (generated on first start), real certificates in production: same paths.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Templates can carry up to 500 drawings; the server rejects bodies over 2 MB too.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    location /socket.io/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Longer than the Socket.IO heartbeat (10 s + 5 s), so idle sockets aren't cut by nginx.
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://server:3000;
    }

    location / {
        proxy_pass http://web:3000;
    }
}

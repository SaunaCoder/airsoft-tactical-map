name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runners pinned to Ubuntu 24.04: MongoDB 8 refuses to start on Linux kernel 6.19+ (SERVER-121912),
# which ubuntu-latest (Ubuntu 26) ships. Move to ubuntu-latest once a MongoDB release supports it.
jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Its auto pnpm cache needs pnpm before corepack enables it.
          package-manager-cache: false
      # pnpm version comes from `packageManager` in package.json.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Its auto pnpm cache needs pnpm before corepack enables it.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start MongoDB
        run: docker compose up -d --wait mongo || { docker compose logs mongo; exit 1; }
      # Playwright's webServer then starts the server and the web dev server (MongoDB is already up).
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

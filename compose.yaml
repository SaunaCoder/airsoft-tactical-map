# Full stack: `docker compose up --build`, then open https://localhost.
# `pnpm dev` and the e2e tests start only the `mongo` service from this file.
services:
  mongo:
    image: mongo:8
    ports:
      - "27017:27017" # for `pnpm dev`, which runs the server on the host
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build: { context: ., dockerfile: infra/server.Dockerfile }
    environment:
      MONGO_URL: mongodb://mongo:27017/airsoft
    depends_on:
      mongo: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: infra/web.Dockerfile }
    restart: unless-stopped

  nginx:
    build: { context: ., dockerfile: infra/nginx.Dockerfile }
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Hosts the self-signed certificate covers. Add your LAN IP to test on a phone (see README).
      CERT_HOSTS: ${CERT_HOSTS:-localhost}
    volumes:
      - certs:/etc/nginx/certs
    depends_on:
      server: { condition: service_healthy }
      web: { condition: service_healthy }
    restart: unless-stopped

volumes:
  mongo-data:
  certs:
